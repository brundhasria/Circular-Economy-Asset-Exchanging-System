spring.application.name=exchange

# Server Port (Dynamic on Render, default 8081 locally)
server.port=${PORT:8081}

# Database Configuration (Dynamic Cloud PostgreSQL or Local Persistent H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/exchangedb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Hibernate DDL Auto & Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# GCP / Gemini API Key (Optional fallback)
gcp.api.key=${GCP_API_KEY:}
gemini.api.key=${GCP_API_KEY:}
