spring.application.name=exchange

# Server Port (Dynamic on Render, default 8081 locally)
server.port=${PORT:8081}

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:exchangedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console at http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate auto-update schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# GCP / Gemini API Key (Optional fallback)
gcp.api.key=${GCP_API_KEY:}
gemini.api.key=${GCP_API_KEY:}
